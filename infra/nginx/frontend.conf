# Le fichier PID est ecrit dans /tmp, monte en tmpfs (conteneur en lecture seule).
pid /tmp/nginx.pid;

# Nginx interne a l'image frontend — sert la PWA construite.
server {
  listen 8080;   # port non privilegie : permet l'execution en utilisateur nginx
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA : toute route inconnue rend index.html (react-router, SDD §20.3).
  location / { try_files $uri $uri/ /index.html; }

  location = /service-worker.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /manifest.json      { add_header Cache-Control "no-cache"; }
  location /assets/              { expires 1y; add_header Cache-Control "public, immutable"; }
}
