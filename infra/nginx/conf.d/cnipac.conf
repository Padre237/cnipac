# Site CNIPAC — production.
server {
  listen 80;
  server_name cnipac.cm www.cnipac.cm;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name cnipac.cm www.cnipac.cm;

  ssl_certificate     /etc/nginx/certs/cnipac.cm.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/cnipac.cm.key.pem;

  # ------------------------------------------------------------------------
  # En-tetes de securite — NFR-C3-07. Verifies a chaque PR par
  # scripts/gate-entetes-securite.mjs (ADR-031 niveau 1).
  # ------------------------------------------------------------------------
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
  # CSP : tile.openstreetmap.org est indispensable au fond de carte (FR-M2-01).
  # Aucun 'unsafe-eval' — la porte de CI le refuse.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  limit_conn connexions 20;

  # ---- Frontend (PWA) ----------------------------------------------------
  location / {
    proxy_pass http://cnipac-frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ADR-037 : le service worker ne doit JAMAIS etre mis en cache, sous peine
  # de figer indefiniment la version applicative chez l'utilisateur.
  location = /service-worker.js {
    proxy_pass http://cnipac-frontend:80;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Les artefacts de build portent un hachage dans leur nom : cache long.
  location /assets/ {
    proxy_pass http://cnipac-frontend:80;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ---- Authentification : limitation renforcee (NFR-C3-08) ---------------
  location ~ ^/api/v[0-9]+/auth/(login|mfa) {
    limit_req zone=authentification burst=5 nodelay;
    proxy_pass http://cnipac_backend;
    include /etc/nginx/conf.d/proxy-commun.inc;
  }

  # ---- API publique anonyme (art. 26 Loi 2024/001) -----------------------
  location ~ ^/api/v[0-9]+/(producteurs|statistiques|referentiels) {
    limit_req zone=api_publique burst=20 nodelay;
    proxy_pass http://cnipac_backend;
    include /etc/nginx/conf.d/proxy-commun.inc;
  }

  # ---- API authentifiee --------------------------------------------------
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://cnipac_backend;
    include /etc/nginx/conf.d/proxy-commun.inc;
  }

  # Sondes de sante : accessibles depuis le reseau interne uniquement.
  location /health { proxy_pass http://cnipac_backend; access_log off; allow 172.16.0.0/12; deny all; }
  location /metrics { proxy_pass http://cnipac_backend; access_log off; allow 172.16.0.0/12; deny all; }
}
