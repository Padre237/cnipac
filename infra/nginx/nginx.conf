# Nginx CNIPAC — terminaison TLS, durcissement, compression.
# Exigences : NFR-C3-01 (TLS 1.3), NFR-C3-07 (en-tetes), NFR-C1-01/07 (3G).
user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; multi_accept on; use epoll; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Journalisation JSON, consommee par Loki (ADR-038). L'identifiant de
  # correlation permet de remonter d'une alerte a la trace applicative.
  log_format json escape=json '{'
    '"horodatage":"$time_iso8601",'
    '"correlation":"$http_x_request_id",'
    '"methode":"$request_method","chemin":"$uri","statut":$status,'
    '"duree_ms":$request_time,"octets":$body_bytes_sent,'
    '"agent":"$http_user_agent","amont":"$upstream_addr"'
  '}';
  access_log /var/log/nginx/access.log json;

  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 65; server_tokens off;      # NFR-C3-07 : pas de divulgation
  client_max_body_size 50m;                     # pieces jointes (FR-M4-13)

  # Compression — determinante sur connexion 3G (SRS §2.4.2, NFR-C1-07).
  gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/javascript
             application/xml+rss application/geo+json image/svg+xml application/wasm;

  # NFR-C3-08 : anti-force brute (5 tentatives / 10 min).
  limit_req_zone $binary_remote_addr zone=authentification:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api:20m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=api_publique:20m rate=60r/m;
  limit_conn_zone $binary_remote_addr zone=connexions:10m;

  # TLS — NFR-C3-01, cible SSL Labs A ou superieur.
  ssl_protocols TLSv1.3 TLSv1.2;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on; ssl_stapling_verify on;

  include /etc/nginx/blue-green/upstream-actif.conf;   # ADR-032 : lien permute
  include /etc/nginx/conf.d/*.conf;
}
