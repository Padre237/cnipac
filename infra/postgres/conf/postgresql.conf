# =============================================================================
# PostgreSQL 16 — CNIPAC
# ADR-020 : configuration VERSIONNEE et explicite. Les valeurs par defaut de
# l'image officielle ignorent tout du dimensionnement de l'hote.
# Calibrage : hote H2 du SDD §8.3 — 4 vCPU, 16 Go de RAM, SSD.
# =============================================================================

listen_addresses = '*'
port = 5432
max_connections = 200                  # NFR-C1-03 : 200 utilisateurs simultanes
superuser_reserved_connections = 3

# --- Memoire ---------------------------------------------------------------
shared_buffers = 4GB                   # 25 % de la RAM, regle usuelle
effective_cache_size = 12GB            # 75 % : indication au planificateur
work_mem = 16MB                        # par operation de tri ; 200 conn. x qq ops
maintenance_work_mem = 1GB             # VACUUM, CREATE INDEX, restaurations
huge_pages = try

# --- Ecriture et WAL -------------------------------------------------------
wal_level = replica                    # defaut PostgreSQL 16
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_compression = on

# --- Planificateur (SSD) ---------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Parallelisme ----------------------------------------------------------
# Les vues materialisees des tableaux de bord M3 declenchent des plans
# paralleles : c'est ce qui rend shm_size=1gb indispensable cote Docker.
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Journalisation --------------------------------------------------------
log_destination = 'stderr'
logging_collector = off                # les journaux sortent vers Docker/Loki
log_min_duration_statement = 800       # NFR-C1-02 : tracer ce qui depasse le SLO
log_checkpoints = on
log_connections = on                   # NFR-C3 : tracabilite des acces
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d [%a] '
log_timezone = 'Africa/Douala'

# --- Statistiques et supervision (ADR-038) ---------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on

# --- Autovacuum ------------------------------------------------------------
# Les tables d'audit et de versions ne font que croitre : autovacuum plus
# agressif pour eviter la degradation progressive des index.
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Securite --------------------------------------------------------------
password_encryption = scram-sha-256     # NFR-C3-06
ssl = off                               # TLS termine par Nginx (SDD §8.4) ;
                                        # le reseau Docker du tier donnees est interne.

# --- Localisation (NFR-C8-02, NFR-C8-03) -----------------------------------
timezone = 'Africa/Douala'
datestyle = 'iso, dmy'
lc_messages = 'fr_FR.UTF-8'
lc_monetary = 'fr_FR.UTF-8'
lc_numeric = 'fr_FR.UTF-8'
lc_time = 'fr_FR.UTF-8'
default_text_search_config = 'pg_catalog.french'

# --- Delais ----------------------------------------------------------------
statement_timeout = 60s                 # aucune requete applicative ne doit durer 1 min
idle_in_transaction_session_timeout = 300s
lock_timeout = 10s                      # evite qu'une migration ne bloque le service
