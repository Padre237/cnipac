# Controle d'acces PostgreSQL — CNIPAC
# Le reseau du tier donnees est interne au demon Docker (SDD §8.4) : aucun
# acces depuis l'exterieur de l'hote n'est possible.
# TYPE   BASE        UTILISATEUR       ADRESSE          METHODE
local    all         all                                scram-sha-256
host     cnipac      cnipac            samenet          scram-sha-256
host     cnipac      cnipac_metrics    samenet          scram-sha-256
host     all         postgres          127.0.0.1/32     scram-sha-256
# Tout le reste est refuse implicitement.
