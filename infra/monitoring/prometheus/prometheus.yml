# Prometheus CNIPAC — ADR-038.
# Souverainete : instance locale au datacenter CENADI, aucune telemetrie sortante
# (NFR-C9-02). Seule exception admise : une sonde de disponibilite externe, qui
# ne transporte aucune donnee metier (NFR-C2-01 impose une sonde externe).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { systeme: cnipac, environnement: '${CNIPAC_ENV}', site: cenadi-yaounde }

rule_files: ['/etc/prometheus/rules/*.yml']

alerting:
  alertmanagers:
    - static_configs: [{ targets: ['alertmanager:9093'] }]

scrape_configs:
  - job_name: cnipac-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['cnipac-backend-blue:3000', 'cnipac-backend-green:3000']
    relabel_configs:
      - source_labels: [__address__]
        regex: 'cnipac-backend-(blue|green):.*'
        target_label: couleur
        replacement: '$1'

  - job_name: postgres
    static_configs: [{ targets: ['cnipac-postgres-exporter:9187'] }]

  - job_name: redis
    static_configs: [{ targets: ['cnipac-redis-exporter:9121'] }]

  - job_name: nginx
    static_configs: [{ targets: ['cnipac-nginx-exporter:9113'] }]

  - job_name: hotes
    static_configs: [{ targets: ['node-exporter:9100'] }]

  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
