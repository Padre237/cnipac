# Detection de secrets — ADR-033.
# La detection porte sur l'historique complet en execution planifiee : un secret
# committe puis retire reste dans l'historique Git.
title = "CNIPAC — configuration gitleaks"

[extend]
useDefault = true

[[rules]]
id = "cnipac-jeton-kobotoolbox"
description = "Jeton d'API KoboToolbox (connecteur M1)"
regex = '''(?i)(kobo[_-]?(token|api[_-]?key)|KOBO_TOKEN)['"\s:=]{1,10}([a-f0-9]{40})'''
tags = ["cnipac", "m1", "kobo"]

  [rules.allowlist]
  description = "Valeurs de developpement et de CI. La production monte ses secrets en fichiers (ADR-033)."
  paths = [
    '''^infra/compose/docker-compose\.dev\.yml$''',
    '''^infra/compose/compose\.ci\.yml$''',
    '''^infra/compose/docker-compose\.restore-drill\.yml$''',
    '''^\.github/workflows/.*\.yml$''',
    '''^\.env\.example$''',
    '''^infra/postgres/tests/.*$''',
  ]

[[rules]]
id = "cnipac-secret-jwt"
description = "Secret de signature JWT (M6)"
regex = '''(?i)(jwt[_-]?secret|JWT_SECRET)['"\s:=]{1,10}([A-Za-z0-9+/=_-]{24,})'''
tags = ["cnipac", "m6", "auth"]

  [rules.allowlist]
  description = "Valeurs de developpement et de CI. La production monte ses secrets en fichiers (ADR-033)."
  paths = [
    '''^infra/compose/docker-compose\.dev\.yml$''',
    '''^infra/compose/compose\.ci\.yml$''',
    '''^infra/compose/docker-compose\.restore-drill\.yml$''',
    '''^\.github/workflows/.*\.yml$''',
    '''^\.env\.example$''',
    '''^infra/postgres/tests/.*$''',
  ]

[[rules]]
id = "cnipac-url-base-avec-mdp"
description = "Chaine de connexion PostgreSQL contenant un mot de passe"
regex = '''postgres(ql)?://[^:\s]+:[^@\s]{4,}@'''
tags = ["cnipac", "db"]

  [rules.allowlist]
  description = "Valeurs de developpement et de CI. La production monte ses secrets en fichiers (ADR-033)."
  paths = [
    '''^infra/compose/docker-compose\.dev\.yml$''',
    '''^infra/compose/compose\.ci\.yml$''',
    '''^infra/compose/docker-compose\.restore-drill\.yml$''',
    '''^\.github/workflows/.*\.yml$''',
    '''^\.env\.example$''',
    '''^infra/postgres/tests/.*$''',
  ]

[[rules]]
id = "cnipac-cle-cosign"
description = "Cle privee cosign (ADR-024)"
regex = '''-----BEGIN ENCRYPTED SIGSTORE PRIVATE KEY-----'''
tags = ["cnipac", "signature"]

[allowlist]
description = "Faux positifs connus, revus au trimestre"
paths = [
  '''\.gitleaks\.toml$''',
  '''^docs/reference/''',          # documents contractuels Word
  '''^docs/design/''',             # maquettes Stitch
  '''^\.env\.example$''',
  '''^infra/compose/secrets/\.gitkeep$''',
]
regexes = [
  # Valeurs factices deliberees des environnements de developpement et de CI.
  # Elles sont listees une par une, plutot que par exclusion de fichiers
  # entiers : ces fichiers restent ainsi analyses pour de vrais secrets.
  '''cnipac_test''',                        # base ephemere de CI
  '''cnipac_dev''',                         # base de developpement local
  '''drill_jetable''',                      # exercice de restauration
  '''changeme-en-local''',                  # .env.example
  '''secret-de-developpement-local''',      # docker-compose.dev.yml
  '''secret-de-ci-jetable-non-sensible''',  # compose.ci.yml
  '''\$argon2id\$factice''',                # assertions de validation du schema
  '''EXEMPLE_[A-Z_]+''',
]
