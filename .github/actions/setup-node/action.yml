# Installation reproductible de la chaine Node — SDD §4.2 et §26.4.
name: 'Setup Node'
description: 'Installe la version de Node declaree dans .nvmrc et les dependances du lockfile'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Installer les dependances (SDD §26.4)
      shell: bash
      run: npm ci

    # @cnipac/shared-types expose ses types depuis dist/, qui n'est pas versionne.
    # Sans cette construction, le lint et le typage de ses dependants echouent
    # sur des types « impossibles a resoudre ». C'est un prerequis de TOUS les
    # jobs, d'ou sa place dans l'action commune plutot que dans chaque workflow.
    - name: Construire les paquets partages
      shell: bash
      run: npm run build -w @cnipac/shared-types
