# =============================================================================
# Exercice de restauration — SDD §4.4 : « restauration testee trimestriellement ».
# Exigences : NFR-C2-03 (RTO), NFR-C2-05, AC-P3-08,
#             NFR-C3-05 et art. 32 Loi 2024/001 (integrite du journal d'audit)
#
# Le SDD prevoit un test trimestriel. Il est ici AUTOMATISE et execute chaque
# semaine : le cout marginal d'une execution supplementaire est nul, et une
# sauvegarde qui n'a jamais ete restauree n'est pas une sauvegarde.
# =============================================================================
name: Exercice de restauration

on:
  schedule:
    - cron: '0 4 * * 2' # mardi 04h00 UTC
  workflow_dispatch:
    inputs:

permissions:
  contents: read
  issues: write

jobs:
  restauration:
    name: Restaurer et verifier
    runs-on: [self-hosted, cnipac, cenadi]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Chronometrer le debut (mesure du RTO reel — NFR-C2-03)
        id: chrono
        run: echo "debut=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Instance PostgreSQL ephemere isolee
        run: docker compose -f infra/compose/docker-compose.restore-drill.yml up -d --wait

      - name: Restaurer la derniere sauvegarde (pg_dump chiffree age — SDD §27.4)
        run: ./scripts/restaurer.sh --cible=drill --source=derniere

      # -----------------------------------------------------------------------
      # Verifications de coherence. Une restauration qui demarre ne prouve rien.
      # -----------------------------------------------------------------------
      - name: Comptage des tables critiques
        run: ./scripts/verifier-restauration.sh --controle=comptages

      - name: Integrite de la chaine de hachage du journal d'audit (art. 32)
        run: ./scripts/verifier-chaine-audit.sh --cible=drill --exhaustif

      - name: Coherence geospatiale (EPSG:4326, enveloppe Cameroun — NFR-C5-04, RG-M2-03)
        run: ./scripts/verifier-restauration.sh --controle=geospatial

      - name: Coherence de l'automate de statuts (RG-M1-05)
        run: ./scripts/verifier-restauration.sh --controle=automate-statuts

      - name: Unicite des codes producteurs (RG-M1-02)
        run: ./scripts/verifier-restauration.sh --controle=codes-uniques

      - name: Mesurer la fraicheur de la sauvegarde restauree (NFR-C2-05)
        run: ./scripts/verifier-restauration.sh --controle=fraicheur --seuil-heures=26

      - name: Calculer le RTO de l'exercice
        run: |
          fin=$(date +%s)
          rto=$(( (fin - ${{ steps.chrono.outputs.debut }}) / 60 ))
          echo "RTO mesure : ${rto} minutes (cible NFR-C2-03 : <= 240 minutes)"
          echo "rto_minutes=${rto}" >> "$GITHUB_ENV"
          if [ "$rto" -gt 240 ]; then
            echo "::error::RTO de ${rto} min superieur a la cible NFR-C2-03 (240 min)."
            exit 1
          fi

      - name: Consigner le resultat (piece de conformite AC-P3-08)
        if: always()
        run: ./scripts/journal-exercice-restauration.sh --rto=${RTO_MINUTES:-NA} --statut=${{ job.status }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exercice-restauration-${{ github.run_number }}
          path: reports/restauration/
          retention-days: 400 # > 12 mois : couvre l'audit annuel

      - if: always()
        run: docker compose -f infra/compose/docker-compose.restore-drill.yml down -v

      - name: Ouvrir un ticket critique en cas d'echec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[CRITIQUE] Exercice de restauration en echec — ${new Date().toISOString().slice(0,10)}`,
              labels: ['critique', 'exploitation', 'NFR-C2-05'],
              body: [
                "L'exercice hebdomadaire de restauration a echoue.",
                '',
                '**La capacite de reprise du systeme n est pas garantie tant que ce ticket est ouvert.**',
                '',
                `Execution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                'Runbook : docs/runbooks/RB-04-restauration.md',
              ].join('\n'),
            });
