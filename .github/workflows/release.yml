# =============================================================================
# Release CNIPAC — construction, SBOM, signature, publication
# Exigences : NFR-C5-05 (reconstructibilite), NFR-C9-03 (SBOM), SRS §14.8
# ADR : 015 (registry), 016 (tags signes), 023 (digests), 024 (SBOM + cosign)
# Declencheur unique : un tag semver signe pousse sur main.
# =============================================================================
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ${{ vars.CNIPAC_REGISTRY || 'ghcr.io' }}
  PREFIXE_IMAGE: ${{ vars.CNIPAC_IMAGE_PREFIX || 'cenadi-cm/cnipac' }}

jobs:
  # ---------------------------------------------------------------------------
  # Un tag non signe n'est pas construit (ADR-016, SRS §14.8).
  # ---------------------------------------------------------------------------
  verifier-tag:
    name: Verifier la signature du tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      jalon: ${{ steps.v.outputs.jalon }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Le tag est annote et signe
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          type=$(git cat-file -t "$tag")
          if [ "$type" != "tag" ]; then
            echo "::error::Le tag $tag est un tag leger. Le SRS §14.8 exige un tag annote et signe."
            exit 1
          fi
          if ! git tag -v "$tag" 2>&1 | grep -qiE 'good signature|bonne signature'; then
            echo "::error::Signature du tag $tag absente ou invalide."
            exit 1
          fi
      - name: Le tag pointe bien sur main
        run: git merge-base --is-ancestor "${GITHUB_REF_NAME}" origin/main
      - id: v
        name: Determiner le jalon (SRS §14.8)
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in
            0.1.*) echo "jalon=P1" >> "$GITHUB_OUTPUT" ;;
            0.5.*) echo "jalon=P2" >> "$GITHUB_OUTPUT" ;;
            1.*)   echo "jalon=P3" >> "$GITHUB_OUTPUT" ;;
            *)     echo "jalon=intermediaire" >> "$GITHUB_OUTPUT" ;;
          esac

  # ---------------------------------------------------------------------------
  # La release ne se construit pas si la CI du commit n'est pas verte.
  # ---------------------------------------------------------------------------
  pre-requis:
    name: Pre-requis de release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verifier-tag
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run lint && npm run typecheck
      - run: npm run test:unit -- --coverage
      - name: Seuils de couverture du palier courant (ADR-028)
        run: node scripts/gate-coverage.mjs --strict
      - name: Toutes les exigences du palier sont couvertes (ADR-035)
        run: node scripts/gate-tracabilite.mjs --palier=${{ needs.verifier-tag.outputs.jalon }} --strict
      - run: npm run gate:all

  # ---------------------------------------------------------------------------
  # Construction, SBOM, signature, attestation.
  # ---------------------------------------------------------------------------
  construire:
    name: Construire et signer — ${{ matrix.composant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verifier-tag, pre-requis]
    strategy:
      matrix:
        composant: [backend, frontend]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.CNIPAC_REGISTRY_USER || github.actor }}
          password: ${{ secrets.CNIPAC_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.composant }}
          push: true
          # SOURCE_DATE_EPOCH fige les horodatages : builds reproductibles (ADR-015).
          build-args: |
            SOURCE_DATE_EPOCH=0
            VERSION=${{ needs.verifier-tag.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.PREFIXE_IMAGE }}-${{ matrix.composant }}:${{ needs.verifier-tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.PREFIXE_IMAGE }}-${{ matrix.composant }}:sha-${{ github.sha }}
          provenance: true
          sbom: false # SBOM produit explicitement ci-dessous, format CycloneDX

      - name: SBOM CycloneDX (NFR-C9-03 — ADR-024)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.PREFIXE_IMAGE }}-${{ matrix.composant }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.composant }}.cdx.json

      - name: Signature cosign par cle (ADR-024)
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$COSIGN_KEY" > /tmp/cosign.key
          cosign sign --key /tmp/cosign.key --yes \
            "${REGISTRY}/${PREFIXE_IMAGE}-${{ matrix.composant }}@${{ steps.push.outputs.digest }}"
          cosign attest --key /tmp/cosign.key --yes \
            --predicate sbom-${{ matrix.composant }}.cdx.json --type cyclonedx \
            "${REGISTRY}/${PREFIXE_IMAGE}-${{ matrix.composant }}@${{ steps.push.outputs.digest }}"
          shred -u /tmp/cosign.key

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.PREFIXE_IMAGE }}-${{ matrix.composant }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Archiver le SBOM dans le depot (piece de conformite)
        run: |
          mkdir -p docs/conformite/sbom/${{ needs.verifier-tag.outputs.version }}
          cp sbom-${{ matrix.composant }}.cdx.json docs/conformite/sbom/${{ needs.verifier-tag.outputs.version }}/

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.composant }}
          path: sbom-${{ matrix.composant }}.cdx.json
          retention-days: 365

  # ---------------------------------------------------------------------------
  # Note de version (SRS §14.8) et publication.
  # ---------------------------------------------------------------------------
  publier:
    name: Publier la release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verifier-tag, construire]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v4
        with: { pattern: sbom-*, path: sbom/, merge-multiple: true }

      - name: Changelog groupe par module fonctionnel (ADR-036)
        uses: orhun/git-cliff-action@v4
        with: { config: cliff.toml, args: --latest --strip header }
        env: { OUTPUT: CHANGELOG-RELEASE.md }

      - name: Rapport de conformite du jalon (ADR-035)
        run: node scripts/rapport-conformite.mjs --jalon=${{ needs.verifier-tag.outputs.jalon }} --sortie=reports/conformite-${{ needs.verifier-tag.outputs.version }}.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG-RELEASE.md
          files: |
            sbom/*.cdx.json
            reports/conformite-*.md
          prerelease: ${{ contains(needs.verifier-tag.outputs.version, '-') }}
          generate_release_notes: false
